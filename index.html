<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de livros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDEF;--card:#FBFCFC;--ink:#13212B;--mute:#55636E;--line:#D3DBE0;--accent:#0B5C63;--onaccent:#fff;--shadow:rgba(19,33,43,.32);--rib:#C8354A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C171D;--card:#15242C;--ink:#E9F0F3;--mute:#93A4AE;--line:#25373F;--accent:#5CC8C0;--onaccent:#062326;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0C171D;--card:#15242C;--ink:#E9F0F3;--mute:#93A4AE;--line:#25373F;--accent:#5CC8C0;--onaccent:#062326;--shadow:rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:56px 24px 72px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 40px;border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
h1{font:700 clamp(42px,8vw,80px)/.98 "Newsreader",Georgia,serif;letter-spacing:-.02em;margin:0}
.side{max-width:38ch}
.lead{color:var(--mute);margin:0 0 6px}
.count{font:500 italic 18px/1.2 "Newsreader",Georgia,serif;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel{display:flex;align-items:center;justify-content:center;--ph:320px;height:var(--ph);padding:28px;background:color-mix(in srgb,var(--spine) 16%,var(--card))}
.cover{display:block;max-width:100%;max-height:calc(var(--ph) - 56px);width:auto;height:auto;border-radius:2px 4px 4px 2px;box-shadow:0 1px 2px var(--shadow),0 14px 24px -8px var(--shadow)}
.body{display:flex;flex-direction:column;flex:1;padding:20px 20px 22px}
.card h2{font:700 21px/1.22 "Newsreader",Georgia,serif;margin:0 0 4px}
.by{color:var(--mute);font-size:14px;margin:0}
.price{font:700 24px/1 "Newsreader",Georgia,serif;margin:auto 0 16px;padding-top:18px}
.price.none{font:400 14px/1.2 "Instrument Sans",system-ui,sans-serif;color:var(--mute)}
.act{min-height:96px}
.q{margin:0 0 10px;font:600 17px/1.3 "Newsreader",Georgia,serif}
.opts{display:flex;flex-direction:column;gap:8px}
.btn{display:block;width:100%;font:600 15px/1.2 "Instrument Sans",system-ui,sans-serif;text-align:center;text-decoration:none;padding:13px 14px;border-radius:8px;border:2px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--onaccent);transition:filter .15s}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.confirm{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.confirm{animation:none}.btn{transition:none}}
@media(max-width:520px){.wrap{padding:36px 16px 56px}.panel{--ph:280px}}
.gift{position:relative;display:inline-block;line-height:0;max-width:100%}
.tint,.bow{display:none;position:absolute;pointer-events:none}
.done .tint{display:block;inset:0;border-radius:2px 4px 4px 2px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.30) 0 7px,rgba(255,255,255,.12) 7px 14px)}
.done .gift::before,.done .gift::after{content:"";position:absolute;z-index:2}
.done .gift::before{left:50%;top:0;bottom:0;width:15%;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.14) 50%,rgba(0,0,0,.22)),var(--rib)}
.done .gift::after{top:50%;left:0;right:0;height:11%;transform:translateY(-50%);background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(255,255,255,.14) 50%,rgba(0,0,0,.22)),var(--rib)}
.done .bow{display:block;z-index:3;left:50%;top:50%;width:54%;transform:translate(-50%,-64%);color:var(--rib);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:pop .4s ease-out}
.done .cover{filter:saturate(.75)}
.card.done{border-color:var(--rib)}
@keyframes pop{0%{transform:translate(-50%,-64%) scale(.3);opacity:0}70%{transform:translate(-50%,-64%) scale(1.12)}100%{transform:translate(-50%,-64%) scale(1);opacity:1}}
.bought{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}
.bought .ico{width:30px;height:30px;color:var(--rib);flex:none}
.bought strong{font:700 24px/1 "Newsreader",Georgia,serif}
.undo{margin-left:auto;background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 2px}
.undo:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.done .bow{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Lista de livros</h1>
    <div class="side">
      <p class="lead">Escolha um livro para dar de presente. Você confirma antes de ir para a Amazon.</p>
      <p class="count" id="count"></p>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</main>

const BOW='<svg class="bow" viewBox="0 0 100 70" aria-hidden="true"><path fill="currentColor" d="M50 38C30 8 4 14 10 34c4 14 28 12 40 4zM50 38C70 8 96 14 90 34c-4 14-28 12-40 4zM46 42L34 66l12-6 4-16zM54 42l12 24-12-6-4-16z"/><circle cx="50" cy="38" r="7.5" fill="currentColor" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/></svg>';
const ICO='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8C10 8 7.5 7 7.5 5.2c0-1.4 1.8-1.8 2.9-.8C11.3 5.2 12 8 12 8zm0 0c2 0 4.500-1 4.500-2.800 0-1.400-1.800-1.800-2.900-.8C12.700 5.200 12 8 12 8z"/></svg>';
let store=new Set();
const api="/api/book-purchase";
const loadBooked=async()=>{
  try{
    const res=await fetch(api);
    if(!res.ok)return;
    const data=await res.json();
    store=new Set(data.booked||[]);
  }catch(e){}
};
const bookPurchase=key=>fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bookKey:key})}).catch(()=>{});
const cancelPurchase=key=>fetch(api,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({bookKey:key})}).catch(()=>{});
const grid=document.getElementById("grid");
document.getElementById("count").textContent=books.length+" livros para escolher";

loadBooked().then(()=>books.forEach((b,i)=>{
  const c=document.createElement("article");
  c.className="card";c.style.setProperty("--spine",spines[i%spines.length]);
  const h=document.createElement("h2");h.textContent=b.t;
  const by=document.createElement("p");by.className="by";by.textContent=b.a;
  const pr=document.createElement("p");
  pr.className="price"+(b.p==null?" none":"");
  pr.textContent=b.p==null?"Preço não informado":money(b.p);
  const act=document.createElement("div");act.className="act";act.setAttribute("aria-live","polite");
  const pn=document.createElement("div");pn.className="panel";
  if(b.img){const im=document.createElement("img");im.setAttribute("src",b.img);im.setAttribute("alt","Capa de "+b.t);im.className="cover";const g=document.createElement("div");g.className="gift";const tn=document.createElement("span");tn.className="tint";g.append(im,tn);g.insertAdjacentHTML("beforeend",BOW);pn.append(g)}
  const bd=document.createElement("div");bd.className="body";bd.append(h,by,pr,act);
  c.append(pn,bd);grid.append(c);

  const start=()=>{
    act.replaceChildren();
    const buy=mk("button","btn","vou comprar este livro!");
    buy.onclick=ask;act.append(buy);
  };
  const ask=()=>{
    act.replaceChildren();
    const box=document.createElement("div");box.className="confirm";
    const q=document.createElement("p");q.className="q";q.textContent="tem certeza de que vai comprar esse livro?";
    const opts=document.createElement("div");opts.className="opts";
    const yes=mk("a","btn","vou comprar sim, será meu presente!");
    yes.href=href(b);yes.target="_blank";yes.rel="noopener noreferrer";
    yes.onclick=(e)=>{
      e.preventDefault();
      if(yes.getAttribute("aria-disabled")==="true")return;
      yes.setAttribute("aria-disabled","true");
      const dest=yes.href;
      loadBooked().then(()=>{
        if(store.has(b.t)){showTaken()}
        else{window.open(dest,"_blank","noopener,noreferrer");setDone(true)}
      });
    };
    const no=mk("button","btn alt","não vou dar esse presente");
    no.onclick=()=>{start();act.querySelector("button").focus()};
    opts.append(yes,no);box.append(q,opts);act.append(box);yes.focus();
  };
  const showTaken=()=>{
    act.replaceChildren();
    c.classList.add("done");
    const w=document.createElement("div");w.className="bought";
    const st=document.createElement("strong");st.textContent="alguém já comprou este presente!";
    w.append(st);act.append(w);
  };
  const showDone=()=>{
    act.replaceChildren();
    const w=document.createElement("div");w.className="bought";
    w.insertAdjacentHTML("beforeend",ICO);
    const st=document.createElement("strong");st.textContent="comprado!";
    const un=mk("button","undo","descomprar");
    un.onclick=()=>setDone(false);
    w.append(st,un);act.append(w);
  };
  const setDone=v=>{
    v?store.add(b.t):store.delete(b.t);
    v?bookPurchase(b.t):cancelPurchase(b.t);
    c.classList.toggle("done",v);
    v?showDone():start();
  };
  if(store.has(b.t)){c.classList.add("done");showDone()}else start();
}));
function mk(tag,cls,txt){const e=document.createElement(tag);e.className=cls;e.textContent=txt;if(tag==="button")e.type="button";return e}
</script>
</body>
</html>
